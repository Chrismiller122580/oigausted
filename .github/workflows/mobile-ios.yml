name: Mobile iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm run mobile:install

      - name: Capacitor sync
        run: npm run mobile:sync

      - name: Verify scaffold
        run: npm run mobile:verify

      - name: Build iOS (Simulator, no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build