<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>OigaGig</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #fff7ed, #ffffff);
        color: #7c2d12;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 20rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #9a3412;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        margin: 0 auto 1rem;
        background: #c2410c;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">OG</div>
      <h1>Cargando OigaGig…</h1>
      <p>
        Si esta pantalla no desaparece, verifica tu conexión o la URL del servidor en
        <code>capacitor.config.ts</code>.
      </p>
    </main>
    <script>
      // Fallback when not using server.url (e.g. misconfigured sync).
      var target = 'https://oigagig.com'
      if (!window.Capacitor) {
        window.location.replace(target)
      }
    </script>
  </body>
</html>
